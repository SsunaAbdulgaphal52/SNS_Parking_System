{% extends 'parking/base.html' %}

{% block title %}Sign up{% endblock %}

{% block content %}
    <h2>Create an account</h2>

    <form method="post" class="data-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign up</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Login</a>.</p>
{% endblock %}
